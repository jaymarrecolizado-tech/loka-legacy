# CloudPanel → site lokafleet.dictr2.cloud → Vhost → Additional Nginx Directives
# (also stored here for the SSH apply script). Root nginx ignores .htaccess.

location ^~ /logs/ {
    deny all;
    return 403;
}

location ^~ /vendor/ {
    deny all;
    return 403;
}

location ~* \.(log|sql|bak|env|sh|md)$ {
    deny all;
    return 403;
}
